basePath: /
definitions:
  handler.SyncCacheResponse:
    properties:
      synced:
        type: integer
    type: object
  model.Order:
    properties:
      comment:
        type: string
      order_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  model.StreamOrderResponse:
    properties:
      comment:
        type: string
      seq:
        type: integer
      status:
        type: string
      timestamp:
        type: string
    type: object
  model.UpdateOrderRequest:
    properties:
      comment:
        type: string
      order_id:
        type: string
      status:
        type: string
    type: object
  model.UpdateOrderResponse:
    properties:
      order_id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Microservice for tracking current order statuses with PostgreSQL, NATS
    JetStream and Redis.
  title: Order Status Service API
  version: "1.0"
paths:
  /api/admin/sync-cache:
    post:
      description: Reads the latest order statuses from JetStream and writes them
        to Redis
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SyncCacheResponse'
        "500":
          description: Failed to sync cache
          schema:
            type: string
      summary: Synchronize Redis cache
      tags:
      - admin
  /api/orders:
    post:
      consumes:
      - application/json
      description: Publish the order status to JetStream, then save it to PostgreSQL.
        Retrying the same key and body resumes an unfinished request or returns its
        original result.
      parameters:
      - description: Unique request key; reuse only with the same body
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Order status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UpdateOrderResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "409":
          description: Key reused with a different body, request in progress, or concurrent
            order update
          schema:
            type: string
        "500":
          description: Internal server error; retry with the same key and body
          schema:
            type: string
      summary: Update order status
      tags:
      - orders
  /api/orders/{order_id}:
    get:
      description: Returns the current order status from PostgreSQL
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Order'
        "400":
          description: Invalid order_id
          schema:
            type: string
        "404":
          description: Order not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get current order status
      tags:
      - orders
  /api/stream/orders/{order_id}:
    get:
      description: Uses JetStream Direct Get to obtain the latest message without
        creating a consumer
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.StreamOrderResponse'
        "400":
          description: Invalid order_id
          schema:
            type: string
        "404":
          description: Order status not found in stream
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
        "504":
          description: JetStream request timeout
          schema:
            type: string
      summary: Get current order status from JetStream
      tags:
      - orders
swagger: "2.0"
